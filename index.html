<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa SenaiTec</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <header>
            <img src="./img/logo.png" alt="Logo SenaiTec" width="200px" height="200px">
            <h1>Pesquisa SenaiTec</h1>
        </header>
    <section>
        <form action="index.html" method="post">
            <fieldset>
                    <legend>Dados Pessoais</legend>

                    <label for="userName">Nome Completo:</label>
                    <input type="text" name="userName" id="userName" required> 

                    <br>

                    <label for="userAge">Idade:</label>
                    <input type="number" name="userAge" id="userAge" required min="12" max="100">
                    
                    
                    <br>

                    <label for="userBirhDate">Data de nascimento:</label>
                    <input type="date" name="userBirhDate" id="userBirhDate">

                    <br>

                    <label for="userEmail">E-mail:</label>
                    <input type="email" name="userEmail" id="userEmail" required
                    placeholder="seuEmail@gmail.com">

                    <br>

                    <label for="userPhone">Telefone:</label>
                    <input type="tel" name="userPhone" id="userPhone" required pattern="[0-9]{11}" placeholder="(21)12345678">
                
                    <br>

                    <label for="foto">Upload de Foto:</label>
                    <input type="file" name="userImage" id="userImage" accept="image/*">
                
                    <br>

                    </fieldset>

                    <fieldset>
                    <legend>Perfil</legend>

                    <label for="radio">Sexo:</label>

                    <br>
                    
                    <input type="radio" name="userGender" id="userGender1" value="masculino" required> Masculino

                    <br>

                    <input type="radio" name="userGender" id="userGender2" value="feminino" required > Feminino

                    <br>

                        <label for="userMaritalStatus">userMaritalStatus:</label>
                        <select>
                            <option value="">Selecione...</option>
                            <option value="solteiro">Solteiro</option>
                            <option value="Casado">Casado</option>
                            <option value="Divorciado">Divorciado</option>
                            <option value="Viuvo">Viuvo</option>
                            <option value="Casamento ativo">Casamento ativo</option>
                        </select>

                    <br>


                    <label for="userState">userState:</label>
                    <select name="userState" > 
                        <option value="">Selecione...</option>
                        <option value="AC">AC</option>
                        <option value="AL">AL</option>
                        <option value="AP">AP</option>
                        <option value="AM">AM</option>
                        <option value="BA">BA</option>
                        <option value="CE">CE</option>
                        <option value="DF">DF</option>
                        <option value="ES">ES</option>
                        <option value="GO">GO</option>
                        <option value="MA">MA</option>
                        <option value="MT">MT</option>
                        <option value="MS">MS</option>
                        <option value="MG">MG</option>
                        <option value="PA">PA</option>
                        <option value="PB">PB</option>
                        <option value="PR">PR</option>
                        <option value="PE">PE</option>
                        <option value="PI">PI</option>
                        <option value="RJ">RJ</option>
                        <option value="RN">RN</option>
                        <option value="RS">RS</option>
                        <option value="RO">RO</option>
                        <option value="RR">RR</option>
                        <option value="SC">SC</option>
                        <option value="SP">SP</option>
                        <option value="SE">SE</option>
                        <option value="TO">TO</option>
                    </select>

                    <label for="userCity">Cidade<label>
                    <input type="text" name="userCity" id="userCity"
                    placeholder="RJ-Rio de Janeiro">
                    </fieldset>

                    <fieldset>
                    <legend>Hábitos</legend>

                    <p>Redes Sociais</p>

                    <input type="checkbox" name="userSocial" id="userSocial1">
                    <label for="userSocial1">Facebook</label>

                    <br>

                    <input type="checkbox" name="userSocial" id="userSocial2">
                    <label for="userSocial2">Instagram</label>

                        <br>

                        <input type="checkbox" name="userSocial" id="userSocial3">
                        <label for="userSocial3">Twiter</label>


                    <br>

                    <label for="estilo musical">Estilo Musical:</label>
                    <input type="text" name="userMusicStyle" id="userMusicStyle" list="userMusicStyles">

                    <datalist id="userMusicStyles">
                        <option value="Rock">Rock</option>
                        <option value="Metal">Metal</option
                        <option value="Funk">Funk</option>
                        <option value="Sertanejo">Sertanejo</option>
                        <option value="MPB">MPB</option>
                        <option value="POP">POP</option>
                        <option value="Outros">Outros</option>
                    </datalist>

                    <br>
                    <label for="favColor">Cor Favorita:</label>

                    <input type="color" name="fav color" id="favColor">
                    </fieldset>

                    <fieldset>
                    <legend>Opinião</legend>

                    <label for="escala de satisfação">Escala de Satisfação</label>
                    <input type="radio" name="escala" id="escala_1" value="ruim">ruim
                    <input type="radio" name="escala" id="escala_2" value="medio">medio
                    <input type="radio" name="escala" id="escala_3" value="bom">bom
                    <input type="radio" name="escala" id="escala_4" value="excelente">excelente

                    <br>

                    <label for="Comentário aberto">Comentário aberto:</label>
                    <input type="text" name="comentario aberto" id="comentario aberto">
                    </fieldset>

                    <fieldset>
                    <legend>Confirmações</legend>

                    <input type="checkbox" name="consentimento" id="consentimento" required> Eu concordo com a coleta e uso dos meus dados pessoais para fins de pesquisa (LGPD).
                    <label for="Consentimento">Consentimento do Usúario</label>
                    
                    <button type="Submit">Enviar</button>
                        
                    </fieldset>

                     <a href="https://github.com/Deffender09/Pesquisa-senaitec" target="_blank">Link de código aberto GitHub</a>

                    
    </main>
        </form>
    </section>

</body>
</html>
