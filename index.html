<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <header>
            <img src="./img/logo.png" alt="Logo SenaiTec" width="200px" height="200px">
            <h1>Pesquisa SenaiTec</h1>
        </header>
    <section>
        <form action="index.html" method="post">
            <fieldset>
                    <legend>Dados Pessoais</legend>

                    <label for="nome">Nome Completo:</label>
                    <input type="text" name="nome" id="nome" required> 

                    <br>

                    <label for="Idade">Idade:</label>
                    <input type="number" name="idade" id="idade" required min="12" max="100">
                    
                    
                    <br>

                    <label for="Data de nascimento">Data de nascimento:</label>
                    <input type="date" name="data de nascimento" id="data de nascimento">

                    <br>

                    <label for="email">E-mail:</label>
                    <input type="email" name="email" id="email" required>

                    <br>

                    <label for="Telefone">Telefone:</label>
                    <input type="tel" name="tel" id="tel" required pattern="[0-9]{11}" placeholder="(21)12345678">
                
                    <br>

                    <label for="foto">Upload de Foto:</label>
                    <input type="file" name="foto" id="foto" accept="image/*">
                
                    <br>

                    </fieldset>

                    <fieldset>
                    <legend>Perfil</legend>

                    <label for="radio">Sexo:</label>
                    <input type="radio" name="sexo" id="sexo1" value="masculino" required> Masculino
                    <input type="radio" name="sexo" id="sexo2" value="feminino" required > Feminino

                    <br>

                    <label for="estado civil">Estado Civil:</label>
                    <input type="radio" name="estado civil" id="estado civil1" value="solteiro(a)" required> Solteiro(a)
                    <input type="radio" name="estado civil" id="estado civil2" value="casado(a)" required> Casado(a)

                    <br>

                    <label for="cidade">Cidade:</label>
                    <input type="text" name="cidade" id="cidade" required>
                    </fieldset>

                    <fieldset>
                    <legend>Hábitos</legend>

                    <label for="Redes Sociais">Redes Sociais:</label>
                    <input type="text" name="facebook" id="facebook"> Facebook
                    <input type="text" name="instagram" id="instagram"> Instagram

                    <br>

                    <label for="estilo musical">Estilo Musical:</label>
                    <input type="text" name="estilo musical" id="estilo musical">

                    <br>

                    <label for="cor favorita">Cor Favorita:</label>
                    <input type="text" name="cor favorita" id="cor favorita">
                    </fieldset>

                    <fieldset>
                    <legend>Opinião</legend>

                    <label for="escala de satisfação">Escala de Satisfação</label>
                    <input type="radio" name="escala" id="escala_1" value="ruim">ruim
                    <input type="radio" name="escala" id="escala_2" value="medio">medio
                    <input type="radio" name="escala" id="escala_3" value="bom">bom
                    <input type="radio" name="escala" id="escala_4" value="excelente">excelente

                    <br>

                    <label for="Comentário aberto">Comentário aberto:</label>
                    <input type="text" name="comentario aberto" id="comentario aberto">
                    </fieldset>

                    <fieldset>
                    <legend>Confirmações</legend>

                    <label for="Consentimento">Consentimento do Usúario</label>
                    <input type="checkbox" name="consentimento" id="consentimento" required> Eu concordo com a coleta e uso dos meus dados pessoais para fins de pesquisa (LGPD).
                    
                    <button type="Submit">Enviar</button>
                        
                    </fieldset>

                     <a href="https://github.com/Deffender09/Pesquisa-senaitec" target="_blank">Link de código aberto GitHub</a>

                    
    </main>
        </form>
    </section>

</body>
</html>
