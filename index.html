<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Pesquisa SenaiTec</h1>
    </header>

    <section>
        <form action="index.html" method="post">
            <fieldset>
                <legend>Dados Pessoais</legend>

                <label for="nome">Nome Completo:</label>
                <input type="text" name="nome" id="nome" required> 

                <br>

                <label for="Idade">Idade:</label>
                <input type="number" name="idade" id="idade" required min="12" max="100">
                
                
                <br>

                <label for="Data de nascimento">Data de nascimento:</label>
                <input type="date" name="data de nascimento" id="data de nascimento">

                <br>

                <label for="email">E-mail:</label>
                <input type="email" name="email" id="email" required>

                <br>

                <label for="Telefone">Telefone:</label>
                <input type="tel" name="tel" id="tel" required pattern="[0-9]{11}" placeholder="(21)12345678">
                
                <br>

                <label for="foto">Upload de Foto:</label>
                <input type="file" name="foto" id="foto" accept="image/*">
                
                <br>

                </fieldset>

                <fieldset>
                    <legend>Perfil</legend>

                    <label for="radio">Sexo:</label>
                    <input type="checkbox" name="sexo" id="sexo" value="masculino" required> Masculino
                    <input type="checkbox" name="sexo" id="sexo" value="feminino" required> Feminino

                    <br>

                    <label for="estado civil">Estado Civil:</label>
                    <input type="checkbox" name="solteiro(a)" id="solteiro(a)" value="solteiro(a)" required> Solteiro(a)
                    <input type="checkbox" name="casado(a)" id="casado(a)" value="casado(a)" required> Casado(a)

                    <br>

                    <label for="cidade">Cidade:</label>
                    <input type="text" name="cidade" id="cidade" required>
                </fieldset>

                <fieldset>
                    <legend>Hábitos</legend>

                    <label for="Redes Sociais">Redes Sociais:</label>
                    <input type="text" name="facebook" id="facebook"> Facebook
                    <input type="text" name="instagram" id="instagram"> Instagram
                    <input type="text" name="twitter" id="twitter"> Twitter

                    <br>

                    <label for="estilo musical">Estilo Musical:</label>
                    <input type="text" name="estilo musical" id="estilo musical">

                    <br>

                    <label for="cor favorita">Cor Favorita:</label>
                    <input type="text" name="cor favorita" id="cor favorita">
                </fieldset>

                <fieldset>
                    <legend>Opinião</legend>

                    <label for="escala de satisfação">Escala de Satisfação</label>
                    <input type="checkbox" name="ruim" id="ruim" value="ruim">ruim
                </fieldset>

                    <button type="Submit">Enviar</button>

        </form>
    </section>

</body>
</html>
